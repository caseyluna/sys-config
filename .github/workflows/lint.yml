# ------------------------------------------------------------------------------
# Lint config on every push / PR (syntax + load checks; no full install).
# Runs scripts/lint.sh. See docs/TESTING.md.
# ------------------------------------------------------------------------------
name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh tmux neovim shellcheck

      - name: Run lint
        run: bash scripts/lint.sh
