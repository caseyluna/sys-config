# ------------------------------------------------------------------------------
# Lint config on every push / PR (syntax + load checks; no full install).
# Runs scripts/lint.sh (incl. docs coverage). See docs/TESTING.md.
# workflow_dispatch: pr-autofix.yml re-runs this after pushing fix/docs commits
# (pushes made with GITHUB_TOKEN don't trigger push/pull_request events).
# ------------------------------------------------------------------------------
name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh tmux neovim shellcheck

      - name: Run lint
        run: bash scripts/lint.sh
