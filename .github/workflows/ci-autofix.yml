# ------------------------------------------------------------------------------
# CI autofix — when Lint, Linux bootstrap or PR autofix fails on a PR branch,
# Claude reads the failed job's log, fixes the config and pushes the fix.
# ------------------------------------------------------------------------------
# Flow (ubuntu-24.04, triggered by workflow_run on failure):
#   1. Guard: open PR for the branch? failed run still the branch head?
#      fewer than 2 `fix(ci-autofix)` commits already? (else comment + stop)
#   2. Claude gets the failed log (.ci-failure.log), fixes the cause, verifies
#      with lint.sh / docs-check / zsh -n / shellcheck where it can.
#   3. Commit `fix(ci-autofix): …`, push, re-dispatch Lint + Linux bootstrap +
#      PR autofix so the new head gets full checks (GITHUB_TOKEN pushes don't
#      trigger pull_request). A failure there re-enters here (attempt 2).
#   4. Can't fix it (cause in CI itself, needs a human)? → PR comment with the
#      diagnosis instead of a commit.
# Guardrails: never commits .github/, the check scripts, or the allow-lists —
# otherwise "fix CI" could mean "weaken CI". Same-repo PRs only.
# Note: workflow_run workflows only run from the default branch (main), so
# changes here take effect once merged to main.
# Auth: CLAUDE_CODE_OAUTH_TOKEN (same secret as pr-autofix.yml).
# ------------------------------------------------------------------------------
name: CI autofix

on:
  workflow_run:
    workflows: ["Lint", "Linux bootstrap", "PR autofix"]
    types: [completed]

permissions:
  contents: write # push the fix commit
  actions: write # re-dispatch the PR's workflows
  pull-requests: write # comment when it can't fix
  id-token: write # claude-code-action

concurrency:
  group: ci-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false # queue: a second failure re-checks against the new head

jobs:
  fix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["pull_request", "workflow_dispatch"]'), github.event.workflow_run.event) &&
      !contains(fromJSON('["main", "dev"]'), github.event.workflow_run.head_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      WORKFLOW: ${{ github.event.workflow_run.name }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
      MAX_ATTEMPTS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Guard (open PR, not stale, attempts left)
        id: guard
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number,baseRefName -q '.[0] | "\(.number) \(.baseRefName)"')
          if [ -z "$pr" ]; then echo "mode=skip" >> "$GITHUB_OUTPUT"; echo "No open PR for $BRANCH."; exit 0; fi
          read -r number base <<< "$pr"
          { echo "pr=$number"; echo "base=$base"; } >> "$GITHUB_OUTPUT"
          if [ "$(git rev-parse HEAD)" != "$FAILED_SHA" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"; echo "Stale: $BRANCH moved past $FAILED_SHA since the failed run."; exit 0
          fi
          git fetch -q origin "$base"
          attempts=$(git log --format=%s "origin/$base..HEAD" | grep -c '^fix(ci-autofix)' || true)
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
          if [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then echo "mode=giveup" >> "$GITHUB_OUTPUT"; else echo "mode=fix" >> "$GITHUB_OUTPUT"; fi

      - name: Collect the failure
        if: steps.guard.outputs.mode != 'skip'
        run: |
          {
            echo "# $WORKFLOW failed — $RUN_URL"
            echo; echo "## Failed jobs / steps"
            gh run view "$RUN_ID" --json jobs \
              -q '.jobs[] | select(.conclusion=="failure") | "- \(.name): " + ([.steps[] | select(.conclusion=="failure") | .name] | join(", "))'
            echo; echo "## Log (failed steps, last 400 lines)"
            gh run view "$RUN_ID" --log-failed | cut -f2- | sed -E 's/^[0-9T:.-]+Z //' | tail -n 400
          } > .ci-failure.log
          head -20 .ci-failure.log

      - name: Give up (attempt limit reached)
        if: steps.guard.outputs.mode == 'giveup'
        run: |
          {
            echo "🤖 **CI autofix stopped** after ${{ steps.guard.outputs.attempts }} attempts — \`$WORKFLOW\` is still failing: $RUN_URL"
            echo; echo "<details><summary>Failure</summary>"; echo; echo '```'
            sed -n '1,60p' .ci-failure.log; echo '```'; echo "</details>"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ steps.guard.outputs.pr }}" --body-file "$RUNNER_TEMP/comment.md"

      - name: Tools to verify fixes (same as lint.yml)
        if: steps.guard.outputs.mode == 'fix'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh tmux neovim shellcheck ruby

      - name: Claude fixes the failure
        if: steps.guard.outputs.mode == 'fix'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions # attempt 2 is triggered by the bot's re-run
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(grep -rn:*),Bash(bash scripts/lint.sh),Bash(python3 scripts/docs-check.py),Bash(zsh -n:*),Bash(bash -n:*),Bash(shellcheck:*)"
          prompt: |
            A CI check failed on this dotfiles repo's PR branch. Read CLAUDE.md first.
            The failure (workflow, failed steps, log tail) is in .ci-failure.log.
            What the PR changed: `git diff origin/${{ steps.guard.outputs.base }}...HEAD`.

            1. Find the root cause in the log. Workflows: Lint = scripts/lint.sh (syntax,
               shellcheck, json, docs coverage via scripts/docs-check.py); Linux bootstrap =
               setup.sh + scripts/linux/* on Ubuntu/Fedora; PR autofix = setup.sh on macOS +
               scripts/smoke.py.
            2. Fix it in the config: zsh/, tmux/, nvim/, fzf/, ghostty/, git-configs/,
               starship/, claude/, docs/, setup.sh, Brewfile, Taskfile.yml, scripts/linux/,
               scripts/tmux-sessionizer, scripts/code-session.sh.
            3. Verify what you can here (Ubuntu): `bash scripts/lint.sh`,
               `python3 scripts/docs-check.py`, `zsh -n`, `bash -n`, `shellcheck`.
               macOS-only or full-bootstrap failures can't be reproduced — fix from the log.

            Rules: never edit .github/, scripts/lint.sh, scripts/validate.sh, scripts/smoke.py,
            scripts/smoke/, scripts/docs-check.py, scripts/bootstrap-scope.sh, docs/.docs-ignore
            or scripts/smoke/allow.txt — never make a check pass by weakening it. Don't revert
            what the PR intended; make it work. Follow CLAUDE.md conventions.

            If the cause is in CI itself (runner image, workflow, the checks), is flaky/network,
            or can't be fixed safely, change nothing and write the diagnosis + suggested fix to
            .ci-diagnosis.md. Otherwise write one bullet per fix (what was wrong → what you
            changed) to .fix-summary.md.

      - name: Commit, push, re-run checks
        id: commit
        if: steps.guard.outputs.mode == 'fix'
        run: |
          git add -A -- . ':!.github' ':!scripts/lint.sh' ':!scripts/validate.sh' ':!scripts/smoke.py' \
            ':!scripts/smoke' ':!scripts/docs-check.py' ':!scripts/bootstrap-scope.sh' ':!docs/.docs-ignore' \
            ':!.ci-failure.log' ':!.ci-diagnosis.md' ':!.fix-summary.md'
          if git diff --cached --quiet; then echo "pushed=false" >> "$GITHUB_OUTPUT"; echo "No fix committed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { echo "fix(ci-autofix): $WORKFLOW failure"; echo
            cat .fix-summary.md 2>/dev/null || echo "Generated by ci-autofix.yml."
            echo; echo "Failed run: $RUN_URL"; } > "$RUNNER_TEMP/msg"
          git commit -F "$RUNNER_TEMP/msg"
          git push origin "HEAD:$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          gh workflow run lint.yml --ref "$BRANCH"
          gh workflow run linux-bootstrap.yml --ref "$BRANCH" -f mode=auto
          gh workflow run pr-autofix.yml --ref "$BRANCH" -f base="${{ steps.guard.outputs.base }}"

      - name: Comment when nothing was fixed
        if: steps.guard.outputs.mode == 'fix' && steps.commit.outputs.pushed != 'true'
        run: |
          {
            echo "🤖 **CI autofix** looked at the \`$WORKFLOW\` failure ($RUN_URL) but didn't push a fix."
            echo; cat .ci-diagnosis.md 2>/dev/null || echo "No diagnosis was written — see the run log."
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "${{ steps.guard.outputs.pr }}" --body-file "$RUNNER_TEMP/comment.md"
