# ------------------------------------------------------------------------------
# Docs sync — on PRs that change config, Claude updates docs/ to match and
# pushes a `docs:` commit to the PR branch.
# ------------------------------------------------------------------------------
# Auth: Claude subscription token. One-time setup:
#   claude setup-token
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN
# Claude may only edit files; this workflow commits docs/ and nothing else.
# Afterwards it runs scripts/docs-check.py and re-dispatches lint.yml on the new
# head (GITHUB_TOKEN pushes don't trigger workflows, which also prevents loops).
# Same-repo PRs only — fork PRs don't get secrets.
# ------------------------------------------------------------------------------
name: Docs sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "nvim/**"
      - "zsh/**"
      - "tmux/**"
      - "fzf/**"
      - "ghostty/**"
      - "claude/**"
      - "scripts/**"
      - "setup.sh"
      - "Brewfile"
      - "!nvim/lazy-lock.json"

permissions:
  contents: write # push the docs commit
  actions: write # re-dispatch lint.yml
  pull-requests: read
  id-token: write # claude-code-action

concurrency:
  group: docs-sync-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Claude updates docs
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(python3 scripts/docs-check.py)"
          prompt: |
            You keep this dotfiles repo's docs in sync with its config. Read CLAUDE.md first.

            1. See what this PR changed: `git diff origin/${{ env.BASE }}...HEAD -- . ':!docs' ':!nvim/lazy-lock.json'`
            2. Update the matching doc(s) so they describe the config as it now is:
               - nvim/ keymaps, plugins          → docs/KEYS.md
               - zsh/ aliases + functions, tmux/ → docs/CHEATSHEET.md
               - setup.sh, Brewfile, links       → docs/INSTALL.md
               - troubleshooting-relevant changes → docs/DEBUG.md
               - new workflows / scripts         → docs/WORKFLOWS.md, docs/TESTING.md
               Add new items, change descriptions that are now wrong, remove items that no longer exist.
            3. Run `python3 scripts/docs-check.py` and fix anything it reports. Only add to
               docs/.docs-ignore for genuinely internal helpers.

            Rules: edit only files under docs/. Match each doc's existing format exactly
            (task-first tables in KEYS.md, `·`-separated alias lines in CHEATSHEET.md); keep
            descriptions terse. Don't reword or reorganize content unrelated to this diff.
            If the docs are already accurate, change nothing.

      - name: Commit docs
        id: commit
        run: |
          if git diff --quiet -- docs/ && [ -z "$(git ls-files --others --exclude-standard docs/)" ]; then
            echo "Docs already up to date."; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "docs: sync with config changes" -m "Generated by docs-sync.yml (Claude Code)."
          git push origin "HEAD:$HEAD_REF"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Check docs coverage
        run: python3 scripts/docs-check.py

      - name: Re-run lint on the new head
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run lint.yml --ref "$HEAD_REF"
