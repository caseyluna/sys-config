# ------------------------------------------------------------------------------
# .tmux.conf — tmux configuration
# ------------------------------------------------------------------------------
# What it does:
#   Prefix Ctrl-A, vim-style pane keys, true color + undercurl, mouse, vi copy
#   mode (clipboard via tmux-yank), Catppuccin status bar, TPM plugins
#   (auto-installed on first start), session save/restore (resurrect/continuum).
#
# Keys (prefix = Ctrl-A):
#   Panes    | / -  split        h j k l  move         H J K L  resize (repeat)
#   Windows  c new  n/p next/prev  < > reorder
#   Popups   f  project sessionizer     g  lazygit (in current dir)
#   Copy     v  enter copy mode → v select, y copy to clipboard, Esc cancel
#   Session  d detach   s list   Ctrl-s save   Ctrl-r restore
#   Config   r reload   I install plugins   U update plugins
#   Nvim     Ctrl-h/j/k/l move between tmux panes AND nvim splits (no prefix)
#
# How to interact:
#   Edit in repo (tmux/.tmux.conf); ~/.tmux.conf is a symlink. Reload: prefix+r.
#   Add a plugin: add a `set -g @plugin` line, then prefix+I.
#   Plugins are installed to ~/.tmux/plugins (state — never in the repo).
#
# Location: ~/.tmux.conf (symlinked from repo)
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Shell & terminal
# ------------------------------------------------------------------------------
set -g default-shell "${SHELL}"
set -g default-terminal "tmux-256color"
# True color (RGB) and undercurl (usstyle) for every outer terminal (ghostty = xterm-ghostty)
set -ga terminal-features ",*:RGB,*:usstyle"
set -g allow-passthrough on           # image/OSC passthrough for nvim plugins
set -g focus-events on                # nvim autoread / FocusGained
set -g mouse on
set -sg escape-time 10                # no Esc delay in nvim
set -g history-limit 50000
set -g renumber-windows on            # no gaps after closing a window
set -g detach-on-destroy off          # closing a session switches to another instead of exiting
set -g repeat-time 500

# ------------------------------------------------------------------------------
# Prefix and key bindings
# ------------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix                  # prefix twice = send Ctrl-A to the app

# Panes: vim-style move (repeatable) and resize
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits open in the current pane's directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Windows: reorder
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# Reload
unbind r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Popups (need a TTY, so display-popup — not run-shell)
bind f display-popup -E -w 80% -h 70% "tmux-sessionizer"
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# ------------------------------------------------------------------------------
# Copy mode (vi keys; tmux-yank sends `y` to the system clipboard)
# ------------------------------------------------------------------------------
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Escape send -X cancel

# ------------------------------------------------------------------------------
# Plugins (TPM) — prefix+I installs, prefix+U updates
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'       # sane defaults
set -g @plugin 'tmux-plugins/tmux-yank'           # copy to system clipboard
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl-h/j/k/l across nvim + tmux
set -g @plugin 'sainnhe/tmux-fzf'                 # prefix+F: fuzzy sessions/windows/panes
set -g @plugin 'tmux-plugins/tmux-battery'        # battery module for the status bar
set -g @plugin 'tmux-plugins/tmux-resurrect'      # prefix+Ctrl-s save / prefix+Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save + restore on server start
set -g @plugin 'catppuccin/tmux#v2.1.3'           # theme

set -g @yank_selection 'clipboard'
set -g @resurrect-strategy-nvim 'session'         # restore nvim sessions too
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"

# Bootstrap TPM on a fresh machine, then load all plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

# ------------------------------------------------------------------------------
# Status bar — must come AFTER the plugins load so catppuccin modules exist
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_battery}"
