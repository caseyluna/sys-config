# ------------------------------------------------------------------------------
# starship.toml — Shell prompt configuration
# ------------------------------------------------------------------------------
# What it does:
#   Defines the prompt layout (Starship): OS, user, directory, git branch/status,
#   language versions (Rust, Go, Python), Kubernetes context, gcloud project,
#   time, and character (success/error). Uses Catppuccin Mocha palette.
#
# How to interact:
#   Edit in repo (starship/starship.toml). Symlink: ~/.config/starship.toml → repo.
#   Changes apply in new shell or after source ~/.zshrc. Requires Starship 1.14+.
#
# Author: Casey A. Thayer
# Location: ~/.config/starship.toml (symlinked from repo)
# ------------------------------------------------------------------------------

"$schema" = "https://starship.rs/config-schema.json"
palette = "catppuccin_mocha"

# ------------------------------------------------------------------------------
# 🌈 Format: Prompt Layout and Segments
# ------------------------------------------------------------------------------
format = """
[](surface0)\
$os\
$username\
[](bg:peach fg:surface0)\
$directory\
[](fg:peach bg:green)\
$git_branch\
$git_status\
[](fg:green bg:teal)\
$rust\
$golang\
$python\
[](fg:teal bg:blue)\
$kubernetes\
[](fg:blue bg:yellow)\
$gcloud\
[](fg:yellow bg:purple)\
$time\
[ ](fg:purple)\
$line_break$character"""

# ------------------------------------------------------------------------------
# 🎨 Custom Palettes
# ------------------------------------------------------------------------------

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
orange = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# ------------------------------------------------------------------------------
# 🖥 OS and User
# ------------------------------------------------------------------------------

[os]
disabled = false
style = "bg:surface0 fg:text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:text"
format = '[ $user ]($style)'

# ------------------------------------------------------------------------------
# 📂 Directory Display
# ------------------------------------------------------------------------------

[directory]
style = "fg:mantle bg:peach"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ------------------------------------------------------------------------------
# 🌱 Git Integration
# ------------------------------------------------------------------------------

[git_branch]
symbol = ""
style = "bg:green"
format = '[[ $symbol $branch ](fg:base bg:green)]($style)'

[git_status]
style = "bg:green"
format = '[[($all_status)](fg:base bg:green)]($style)'
conflicted = " "  # Git conflict icon
ahead = " "        # Rocket icon
behind = " "       # Down arrow
diverged = "󰈸 "     # Fire icon
untracked = " "    # Question mark icon
stashed = " "      # box icon
modified = " "     # Pencil icon
deleted = " "      # Minus icon
renamed = " "
staged = '[++\($count\)](green)'

# ------------------------------------------------------------------------------
# 🐍 Languages & Runtimes
# ------------------------------------------------------------------------------

[nodejs]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[c]
symbol = " "
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[rust]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[golang]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:base bg:teal)]($style)'

[python]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) {$virtualenv} ](fg:base bg:teal)]($style)'

# ------------------------------------------------------------------------------
# 🐋 Kubernetes, GCloud, Docker
# ------------------------------------------------------------------------------

[docker_context]
symbol = ""
style = "bg:mantle"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[gcloud]
symbol = "󰅟"
format = '[[ $symbol( $project) ](fg:black bg:yellow)]($style)'
style = "bg:yellow"
disabled = false

[kubernetes]
symbol = "󱃾"
format = '[[ $symbol( $context) ](fg:black bg:blue)]($style)'
style = "bg:blue"
disabled = false

# ------------------------------------------------------------------------------
# ⏰ Clock
# ------------------------------------------------------------------------------

[time]
disabled = false
time_format = "%R"
style = "bg:purple"
format = '[[  $time ](fg:mantle bg:purple)]($style)'

# ------------------------------------------------------------------------------
# ✨ Prompt Line & Status Symbol
# ------------------------------------------------------------------------------

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:purple)'
vimcmd_replace_symbol = '[](bold fg:purple)'
vimcmd_visual_symbol = '[](bold fg:lavender)'

